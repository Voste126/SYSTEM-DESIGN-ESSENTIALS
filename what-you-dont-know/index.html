<style>
:root{
  --paper:#EEEDE6; --paper-2:#E6E4D8; --ink:#1D2321; --ink-soft:#4B4A42;
  --muted:#8A8776; --line:#CFCCBC; --accent:#B9762B;
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink); font-family:'Source Serif 4', Georgia, serif; font-size:19px; line-height:1.65;}
.mono{font-family:'IBM Plex Mono', monospace}
header{max-width:720px; margin:0 auto; padding:4rem 24px 1rem;}
header a.back{font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--muted); text-decoration:none;}
header a.back:hover{color:var(--accent);}
h1{font-size:34px; font-weight:600; margin:1rem 0 0.5rem;}
header p.dek{font-size:17px; color:var(--ink-soft); margin:0 0 2rem; max-width:520px;}
main{max-width:720px; margin:0 auto; padding:0 24px 6rem;}
.chapter{
  display:flex; align-items:baseline; gap:16px; padding:1.1rem 0; border-bottom:1px solid var(--line);
}
.chapter .num{font-family:'IBM Plex Mono', monospace; font-size:14px; color:var(--accent); min-width:26px;}
.chapter .title{flex:1; font-size:18px;}
.chapter .status{font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:3px; padding:2px 8px; align-self:center;}
.chapter .links{display:flex; gap:14px; font-family:'IBM Plex Mono', monospace; font-size:13px;}
.chapter .links a{color:var(--ink-soft); text-decoration:none; border-bottom:1px solid var(--line);}
.chapter .links a:hover{color:var(--accent); border-color:var(--accent);}
</style>
</head>
<body>
<header>

</header>
<main>

    <span class="num mono">01</span>
    <span class="title">Reliable, scalable, maintainable applications</span>
    <span class="status">in progress</span>
    <span class="links"><a href="https://github.com/Voste126/SYSTEM-DESIGN-ESSENTIALS/blob/main/what-you-dont-know/01-reliable-scalable-maintainable/notes.md">notes</a></span>
  </div>
</main>
</body>
